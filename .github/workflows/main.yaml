name: Build Check for PROS

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build PROS Project
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install PROS CLI
      - name: Install PROS CLI
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip
          python3 -m pip install pros-cli  # Install latest version

      # Step 3: Verify PROS CLI installation
      - name: Verify PROS installation
        run: pros --version

      # Step 4: Build the PROS project
      - name: Build the project
        run: pros make all
